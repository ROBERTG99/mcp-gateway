# Release on a pushed tag v*: multi-arch images to ghcr.io/robertg99/mcp-gateway, the Helm chart
# as an OCI artifact, and a GitHub release with the changelog section. Tags are pushed by hand;
# Claude Code sessions never push tags or run this workflow.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: gateway
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/robertg99/mcp-gateway:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: examples
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/robertg99/mcp-gateway-examples:${{ steps.v.outputs.version }}

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: images
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.1
      - name: Package and push the chart
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/mcp-gateway --version "$version" --app-version "$version"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "mcp-gateway-$version.tgz" oci://ghcr.io/robertg99/charts

  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [images, chart]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create the release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
