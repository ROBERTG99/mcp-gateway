name: setup
description: Go (go.mod toolchain), uv, pnpm and Node 22, and the pinned tools in ./bin (make bootstrap)
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: e2e/package.json
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: e2e/pnpm-lock.yaml
    - uses: actions/cache@v4
      with:
        path: bin
        key: tools-${{ runner.os }}-${{ hashFiles('Makefile', 'scripts/install_tools.sh', 'go.mod') }}
    - name: make bootstrap
      shell: bash
      run: make bootstrap
    - name: Put the pinned tools on PATH for later steps
      shell: bash
      run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
