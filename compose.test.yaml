# make test-docker: the full test suite inside containers, on top of compose.yaml. go-tests runs
# the Go unit and integration tests with the race detector against their own postgres-test and
# redis-test (the tests set cluster-wide role passwords and flush databases, so they never share the
# stack's servers) and the compose dynamodb (MCPGW_TEST_USE_COMPOSE=1); harness-tests runs the Python
# tests. Everything here has the profile `test`, so a plain `docker compose up` never starts it.
services:
  postgres-test:
    profiles: ["test"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-test:
    profiles: ["test"]
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  go-tests:
    profiles: ["test"]
    build:
      context: .
      network: "${MCPGW_BUILD_NETWORK:-default}" # see x-build in compose.yaml
      target: test
      args:
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
    image: mcp-gateway-test:dev
    command: ["go", "test", "-race", "-count=1", "-tags=integration", "./..."]
    environment:
      MCPGW_TEST_USE_COMPOSE: "1"
      MCPGW_TEST_DATABASE_URL: postgres://postgres:postgres@postgres-test:5432/postgres?sslmode=disable
      MCPGW_TEST_REDIS_URL: redis://redis-test:6379/0
      MCPGW_TEST_DYNAMODB_ENDPOINT: http://dynamodb:8000
    healthcheck:
      disable: true
    depends_on:
      postgres-test: { condition: service_healthy }
      redis-test: { condition: service_healthy }
      dynamodb: { condition: service_healthy }

  harness-tests:
    profiles: ["test"]
    build:
      context: .
      network: "${MCPGW_BUILD_NETWORK:-default}" # see x-build in compose.yaml
      target: test
      args:
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
    image: mcp-gateway-test:dev
    command: ["uv", "run", "--frozen", "--no-sync", "pytest"]
    healthcheck:
      disable: true
