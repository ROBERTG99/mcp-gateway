name: mcp-gateway

x-build: &build
  context: .
  # Host networking only where the build must reach a proxy on the host (the agent sandbox:
  # MCPGW_BUILD_NETWORK=host). Compose builds through Bake, which refuses network: host without an
  # interactive --allow=network.host, so `docker compose up --build` fails in CI and other non-TTYs.
  network: "${MCPGW_BUILD_NETWORK:-default}"
  args:
    HTTPS_PROXY: "${HTTPS_PROXY:-}"

x-db-env: &db-env
  MCPGW_MIGRATE_DATABASE_URL: postgres://postgres:postgres@postgres:5432/mcpgw?sslmode=disable
  MCPGW_DATABASE_URL: postgres://mcpgw_app:${MCPGW_APP_DB_PASSWORD:-mcpgw_app}@postgres:5432/mcpgw?sslmode=disable
  MCPGW_APP_DB_PASSWORD: ${MCPGW_APP_DB_PASSWORD:-mcpgw_app}
  MCPGW_READONLY_DB_PASSWORD: ${MCPGW_READONLY_DB_PASSWORD:-mcpgw_readonly}
  MCPGW_UPSTREAM_DB_PASSWORD: ${MCPGW_UPSTREAM_DB_PASSWORD:-mcpgw_upstream}

x-upstream-env: &upstream-env
  MCPGW_UPSTREAM_DATABASE_URL: postgres://mcpgw_upstream:${MCPGW_UPSTREAM_DB_PASSWORD:-mcpgw_upstream}@postgres:5432/mcpgw?sslmode=disable&pool_max_conns=32
  MCPGW_FAULT_TIMEOUT_RATE: ${MCPGW_FAULT_TIMEOUT_RATE:-0}
  MCPGW_FAULT_STALL: ${MCPGW_FAULT_STALL:-12s}
  MCPGW_FAULT_STALL_KEY_PREFIX: ${MCPGW_FAULT_STALL_KEY_PREFIX:-demo-stall-}
  MCPGW_OTEL_ENDPOINT: ${MCPGW_OTEL_ENDPOINT:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mcpgw
    ports: ["127.0.0.1:8220:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mcpgw"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports: ["127.0.0.1:8230:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  dynamodb:
    profiles: ["dynamodb"]
    image: amazon/dynamodb-local:3.3.2
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports: ["127.0.0.1:8240:8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  approval-sink:
    image: wiremock/wiremock:3.9.1
    command: ["--port", "8080", "--disable-banner"]
    volumes: ["./deploy/wiremock:/home/wiremock:ro"]
    ports: ["127.0.0.1:8241:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/__admin/health || curl -fs http://localhost:8080/__admin/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: { <<: *build, target: gateway }
    image: mcp-gateway:dev
    command: ["migrate", "up"]
    environment: *db-env
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }

  upstream-ledger:
    build: { <<: *build, target: examples }
    image: mcp-gateway-examples:dev
    entrypoint: ["/usr/local/bin/upstream-ledger", "--addr", ":8213"]
    environment:
      <<: *upstream-env
    ports: ["127.0.0.1:8213:8213"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/mcp-gateway", "healthcheck", "http://127.0.0.1:8213/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      migrate: { condition: service_completed_successfully }

  upstream-crm:
    build: { <<: *build, target: examples }
    image: mcp-gateway-examples:dev
    entrypoint: ["/usr/local/bin/upstream-crm", "--addr", ":8214"]
    environment:
      <<: *upstream-env
    ports: ["127.0.0.1:8214:8214"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/mcp-gateway", "healthcheck", "http://127.0.0.1:8214/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      migrate: { condition: service_completed_successfully }

  upstream-orders:
    build: { <<: *build, target: examples }
    image: mcp-gateway-examples:dev
    entrypoint: ["/usr/local/bin/upstream-orders", "--addr", ":8215"]
    environment:
      <<: *upstream-env
    ports: ["127.0.0.1:8215:8215"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/mcp-gateway", "healthcheck", "http://127.0.0.1:8215/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      migrate: { condition: service_completed_successfully }

  seed:
    profiles: ["tools"]
    build: { <<: *build, target: examples }
    image: mcp-gateway-examples:dev
    entrypoint: ["/usr/local/bin/datagen", "seed"]
    environment:
      <<: *upstream-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  dev-issuer:
    build: { <<: *build, target: gateway }
    image: mcp-gateway:dev
    command: ["dev-issuer"]
    environment:
      MCPGW_DEV_ISSUER_ENABLED: "true"
      MCPGW_DEV_ISSUER_ADDR: ":8212"
    ports: ["127.0.0.1:8212:8212"]
    healthcheck:
      test: ["CMD", "/mcp-gateway", "healthcheck", "http://127.0.0.1:8212/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  gateway:
    build: { <<: *build, target: gateway }
    image: mcp-gateway:dev
    environment:
      MCPGW_DATABASE_URL: postgres://mcpgw_app:${MCPGW_APP_DB_PASSWORD:-mcpgw_app}@postgres:5432/mcpgw?sslmode=disable&pool_max_conns=32
      MCPGW_UPSTREAMS_FILE: /config/upstreams.yaml
      MCPGW_TENANTS_FILE: ${MCPGW_STACK_TENANTS_FILE:-/config/tenants.yaml} # override: make loadtest (not MCPGW_TENANTS_FILE, which .env sets for the host)
      MCPGW_JWKS_URL: http://dev-issuer:8212/.well-known/jwks.json
      MCPGW_DEV_ISSUER_URL: http://dev-issuer:8212
      MCPGW_REDIS_URL: redis://redis:6379/0
      MCPGW_APPROVAL_WEBHOOK_URL: http://approval-sink:8080/approvals
      MCPGW_APPROVAL_WEBHOOK_SECRET: ${MCPGW_APPROVAL_WEBHOOK_SECRET:-dev-webhook-secret-change-me}
      MCPGW_UPSTREAM_TIMEOUT: ${MCPGW_UPSTREAM_TIMEOUT:-10s}
      MCPGW_OTEL_ENDPOINT: ${MCPGW_OTEL_ENDPOINT:-}
      MCPGW_BREAKER_COOLDOWN: ${MCPGW_BREAKER_COOLDOWN:-30s}
    ports: ["127.0.0.1:8200:8200", "127.0.0.1:8210:8210", "127.0.0.1:8211:8211"]
    healthcheck:
      test: ["CMD", "/mcp-gateway", "healthcheck", "http://127.0.0.1:8200/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      dev-issuer: { condition: service_healthy }
      approval-sink: { condition: service_healthy }
      upstream-ledger: { condition: service_healthy }
      upstream-crm: { condition: service_healthy }
      upstream-orders: { condition: service_healthy }

  # Profile `observability` (make observability): Prometheus 8250, Grafana 8251, Jaeger UI 8253.
  # The gateway exports traces to Jaeger's OTLP endpoint when MCPGW_OTEL_ENDPOINT is set.
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro
    ports: ["127.0.0.1:8250:9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      gateway: { condition: service_healthy }

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:8251:3000"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      prometheus: { condition: service_healthy }

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/jaeger:2.8.0
    ports: ["127.0.0.1:8253:16686"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:16686/"]
      interval: 5s
      timeout: 3s
      retries: 30
