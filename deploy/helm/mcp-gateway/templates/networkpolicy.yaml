{{- if .Values.networkPolicy.enabled }}
# Ingress only: agents and operators reach 8210 and 8200, Prometheus reaches 8211. Egress stays open
# because the gateway calls configurable upstreams, the issuer's JWKS, Postgres, Redis and DynamoDB.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcpgw.fullname" . }}
  labels:
    {{- include "mcpgw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcpgw.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - { port: mcp, protocol: TCP }
        - { port: admin, protocol: TCP }
      from:
        {{- if .Values.networkPolicy.ingressFrom }}
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
    {{- with .Values.networkPolicy.metricsFrom }}
    - ports:
        - { port: metrics, protocol: TCP }
      from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
