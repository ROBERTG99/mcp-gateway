{{- if .Values.networkPolicy.enabled }}
# Ingress only, one rule per port: agents reach MCP (8210), operators and approvers the admin API
# and console (8200), Prometheus the metrics (8211). Egress stays open because the gateway calls
# configurable upstreams, the issuer's JWKS, Postgres, Redis and DynamoDB.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcpgw.fullname" . }}
  labels:
    {{- include "mcpgw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcpgw.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - { port: mcp, protocol: TCP }
      from:
        {{- if .Values.networkPolicy.mcpFrom }}
        {{- toYaml .Values.networkPolicy.mcpFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
    - ports:
        - { port: admin, protocol: TCP }
      from:
        {{- if .Values.networkPolicy.adminFrom }}
        {{- toYaml .Values.networkPolicy.adminFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
    {{- with .Values.networkPolicy.metricsFrom }}
    - ports:
        - { port: metrics, protocol: TCP }
      from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
---
# The migrate Job serves nothing: no ingress at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcpgw.fullname" . }}-migrate
  labels:
    {{- include "mcpgw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mcpgw.name" . }}-migrate
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Ingress"]
{{- end }}
