apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcpgw.fullname" . }}
  labels:
    {{- include "mcpgw.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "mcpgw.selectorLabels" . | nindent 4 }}
  ports:
    - { name: admin, port: {{ .Values.service.ports.admin }}, targetPort: admin, protocol: TCP }
    - { name: mcp, port: {{ .Values.service.ports.mcp }}, targetPort: mcp, protocol: TCP }
    - { name: metrics, port: {{ .Values.service.ports.metrics }}, targetPort: metrics, protocol: TCP }
